name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # Formatting and the checks every public repository needs: text, secrets, unsafe code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Keep build output out of the checkout
        run: echo "ONEYAML_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore OneYaml.slnx
      - name: Format
        # The formatter loads projects in the Debug configuration and runs the source
        # generator from its Debug output, so that output has to exist first.
        run: |
          dotnet build src/OneYaml.SourceGeneration/OneYaml.SourceGeneration.csproj -c Debug --no-restore
          dotnet format OneYaml.slnx --verify-no-changes --no-restore
      - name: Build the guard tool
        run: dotnet build tools/PublicBoundary/PublicBoundary.csproj -c Release --no-restore
      - name: Pushed range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # A pull request checks base..head. A push checks before..after, or the
          # whole history for a new branch or a before commit that is gone.
          range=HEAD
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$PUSH_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "checking $range"
      - name: Public text, whole tree
        run: dotnet run --project tools/PublicBoundary -c Release --no-build -- publictext --tree
      - name: Public text, commit messages
        run: dotnet run --project tools/PublicBoundary -c Release --no-build -- publictext --commits "${{ steps.range.outputs.range }}"
      - name: Secret scan
        run: dotnet run --project tools/PublicBoundary -c Release --no-build -- secretscan --range "${{ steps.range.outputs.range }}"
      - name: No unsafe code in src
        run: |
          pat='\bunsafe\b|AllowUnsafeBlocks|System\.Runtime\.CompilerServices\.Unsafe\b|\bUnsafe\.|MemoryMarshal|\bfixed[[:space:]]*\('
          if grep -rnE --include='*.cs' --include='*.csproj' --include='*.props' --include='*.targets' "$pat" src; then
            echo "unsafe code or Unsafe/MemoryMarshal found under src/"
            exit 1
          fi

  # Build with warnings as errors (trim and AOT analyzers included) and run every
  # test, Slow ones too, on both runtimes. The tests target net8.0 and net10.0.
  # The conformance tests read the shared case kit, checked out at a pinned commit.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The kit commit the conformance tests run against. To move it, put the full SHA of a
      # commit of recursive-ai-oss/oneyaml-kit here, run the tests, and fix what changed.
      KIT_REF: 6cc83d12fbc6d993bc489aa5712e114bb4c40b83
    steps:
      # Windows runners check out with line-ending conversion on by default. The kit cases and
      # the YAML under test need their exact bytes, so conversion is off before any checkout.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: recursive-ai-oss/oneyaml-kit
          ref: ${{ env.KIT_REF }}
          path: kit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Point the tests at the kit
        run: |
          echo "ONEYAML_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
          echo "ONEYAML_KIT=$GITHUB_WORKSPACE/kit" >> "$GITHUB_ENV"
          echo "ONEYAML_YTS_DIR=$GITHUB_WORKSPACE/kit/suites/yaml-test-suite/data-2022-01-17" >> "$GITHUB_ENV"
          echo "ONEYAML_WORKLOADS=$RUNNER_TEMP/workloads" >> "$GITHUB_ENV"
      - name: Prepare the benchmark workloads
        # Writes the workloads the way the kit's own harnesses read them, edit scripts included.
        # The kit's launcher imports a POSIX-only module, so the workload writer is called directly.
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'kit/bench'); from oneyaml_bench import workloads; workloads.prepare(Path(sys.argv[1]), ('quick',))" "$ONEYAML_WORKLOADS"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore OneYaml.slnx
      - name: Build
        run: dotnet build OneYaml.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution OneYaml.slnx -c Release --no-build --results-directory "$ONEYAML_ARTIFACTS/TestResults"
      - name: Document tests with the held-back move checked
        # Builds the library so that a read which skips the held-back check throws, and runs the edit tests on it.
        if: runner.os == 'Linux'
        run: dotnet test --project tests/OneYaml.Tests -c Release --no-restore -p:OneYamlCheckHeld=1 --results-directory "$ONEYAML_ARTIFACTS/TestResultsHeld" -- --filter-namespace "OneYaml.Tests.Document"

  # Packs the three packages and checks what a user would receive: a readme in each, and the exact
  # OneYaml dependency in both compat packages (they use internals of OneYaml).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep build output out of the checkout
        run: echo "ONEYAML_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx
      # Build once and pack the built binaries, the same way the release workflow does.
      - name: Build
        run: dotnet build OneYaml.slnx -c Release
      - name: Pack
        run: |
          for project in src/OneYaml src/OneYaml.Compat.YamlDotNet src/OneYaml.Compat.SharpYaml; do
            dotnet pack "$project" -c Release --no-build -o "$RUNNER_TEMP/packages" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          done
          ls -l "$RUNNER_TEMP/packages"
      - name: Check the packages
        run: |
          cd "$RUNNER_TEMP/packages"
          version=$(dotnet msbuild "$GITHUB_WORKSPACE/src/OneYaml" -getProperty:PackageVersion | tr -d '[:space:]')
          for id in OneYaml OneYaml.Compat.YamlDotNet OneYaml.Compat.SharpYaml; do
            pkg="$id.$version.nupkg"
            test -f "$pkg" || { echo "::error::$pkg was not produced"; exit 1; }
            test -f "$id.$version.snupkg" || { echo "::error::$id.$version.snupkg was not produced"; exit 1; }
            unzip -p "$pkg" "$id.nuspec" | grep -q "<readme>README.md</readme>" || { echo "::error::$pkg declares no readme"; exit 1; }
            unzip -l "$pkg" | grep -q " README.md$" || { echo "::error::$pkg does not contain README.md"; exit 1; }
          done
          unzip -l "OneYaml.$version.nupkg" | grep -q "analyzers/dotnet/cs/OneYaml.SourceGeneration.dll" || { echo "::error::the source generator is not in the OneYaml package"; exit 1; }
          for id in OneYaml.Compat.YamlDotNet OneYaml.Compat.SharpYaml; do
            deps=$(unzip -p "$id.$version.nupkg" "$id.nuspec" | grep '<dependency id="OneYaml"' || true)
            echo "$deps"
            exact=$(echo "$deps" | grep -cF "version=\"[$version]\"" || true)
            total=$(echo "$deps" | wc -l)
            [ "$exact" -eq "$total" ] && [ "$exact" -ge 1 ] || { echo "::error::$id does not depend on exactly OneYaml [$version]"; exit 1; }
          done

  # Publishes the smoke program with native AOT (warnings as errors) and runs it. The runner image
  # carries the native toolchain; the step installs it only if it is missing.
  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep build output out of the checkout
        run: echo "ONEYAML_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.4xx
      - name: Native toolchain
        run: |
          if ! command -v clang >/dev/null || ! dpkg -s zlib1g-dev >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang zlib1g-dev
          fi
      - name: Publish and run
        run: tests/OneYaml.AotSmoke/run.sh
