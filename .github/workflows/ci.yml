name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # Formatting and the public-repository guards.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep build output out of the checkout
        run: echo "ONEYAML_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore OneYaml.slnx
      - name: Format
        run: dotnet format OneYaml.slnx --verify-no-changes --no-restore
      - name: Build the guard tool
        run: dotnet build tools/PublicBoundary/PublicBoundary.csproj -c Release --no-restore
      - name: Pushed range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # A pull request checks base..head. A push checks before..after, or the
          # whole history for a new branch or a before commit that is gone.
          range=HEAD
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$PUSH_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "checking $range"
      - name: Public text, whole tree
        run: dotnet run --project tools/PublicBoundary -c Release --no-build -- publictext --tree
      - name: Public text, commit messages
        run: dotnet run --project tools/PublicBoundary -c Release --no-build -- publictext --commits "${{ steps.range.outputs.range }}"
      - name: Secret scan
        run: dotnet run --project tools/PublicBoundary -c Release --no-build -- secretscan --range "${{ steps.range.outputs.range }}"
      - name: No unsafe code in src
        run: |
          pat='\bunsafe\b|AllowUnsafeBlocks|System\.Runtime\.CompilerServices\.Unsafe|\bUnsafe\.|MemoryMarshal|\bfixed[[:space:]]*\('
          if grep -rnE --include='*.cs' --include='*.csproj' --include='*.props' --include='*.targets' "$pat" src; then
            echo "unsafe code or Unsafe/MemoryMarshal found under src/"
            exit 1
          fi

  # Build with warnings as errors (trim and AOT analyzers included) and run every
  # test, Slow ones too, on both runtimes. The tests target net8.0 and net10.0.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Keep build output out of the checkout
        run: echo "ONEYAML_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore OneYaml.slnx
      - name: Build
        run: dotnet build OneYaml.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution OneYaml.slnx -c Release --no-build --results-directory "$ONEYAML_ARTIFACTS/TestResults"
